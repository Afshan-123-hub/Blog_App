<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Ledger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="index.html" class="brand">Ledger <span class="brand-mark">vol. 01</span></a>
    <nav class="mainnav" data-nav></nav>
  </div>
</header>

<section class="auth-shell">
  <div class="wrap">
    <div class="card">
      <span class="eyebrow">Start a new line</span>
      <h1 style="font-size:1.6rem;">Register for Ledger</h1>

      <div id="banner" class="banner banner-error"></div>

      <form id="register-form" novalidate>
        <div class="field" id="field-name">
          <label for="name">Name</label>
          <input type="text" id="name" autocomplete="name" placeholder="Your name">
          <div class="field-error">Enter your name.</div>
        </div>
        <div class="field" id="field-email">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
          <div class="field-error">Enter a valid email address.</div>
        </div>
        <div class="field" id="field-password">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" placeholder="At least 6 characters">
          <div class="field-error">Password needs at least 6 characters.</div>
        </div>
        <div class="field" id="field-confirm">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" autocomplete="new-password" placeholder="••••••••">
          <div class="field-error">Passwords don&rsquo;t match.</div>
        </div>
        <button type="submit" class="btn btn-stamp btn-full">Create account</button>
      </form>

      <p class="form-note">Already registered? <a href="login.html">Log in</a>.</p>
    </div>
  </div>
</section>

<footer>
  <div class="wrap" style="width:100%;">Ledger — a running record</div>
</footer>

<script src="app.js"></script>
<script>
  renderNav('register');

  if(currentUser()){ window.location.href = 'dashboard.html'; }

  const form = document.getElementById('register-form');
  const banner = document.getElementById('banner');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    banner.classList.remove('show');

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    let valid = true;

    document.getElementById('field-name').classList.toggle('error', name.length === 0);
    if(name.length === 0) valid = false;

    const emailOk = /^\S+@\S+\.\S+$/.test(email);
    document.getElementById('field-email').classList.toggle('error', !emailOk);
    if(!emailOk) valid = false;

    document.getElementById('field-password').classList.toggle('error', password.length < 6);
    if(password.length < 6) valid = false;

    document.getElementById('field-confirm').classList.toggle('error', confirm !== password || password.length === 0);
    if(confirm !== password || password.length === 0) valid = false;

    if(!valid) return;

    const users = Store.users();
    if(users.some(u => u.email === email)){
      banner.textContent = 'An account with that email already exists.';
      banner.classList.add('show');
      return;
    }

    users.push({ name, email, password, joinedAt: Date.now() });
    Store.saveUsers(users);
    Store.setSession(email);
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
